  <style>
    :root {
      --phosphor: #00ff66;
      --phosphor-dim: #008f39;
      --phosphor-bright: #66ff99;
      --bg: #050a05;
      --bar-bg: #001105;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--phosphor);
      font-family: 'VT323', monospace;
      font-size: 21px;
      line-height: 1.35;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.45);
    }

    /* Top Status Bar */
    header {
      background: var(--bar-bg);
      border-bottom: 1px solid var(--phosphor-dim);
      padding: 6px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-transform: uppercase;
      font-size: 16px;
      letter-spacing: 1px;
      z-index: 10;
    }

    #clock {
      font-size: 13px;
      color: var(--phosphor-dim);
      letter-spacing: 0.5px;
    }

    /* Centered Darknet Box (Password & Lockout) */
    #center-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid var(--phosphor-dim);
      padding: 24px 32px;
      background: var(--bg);
      text-align: center;
      min-width: 380px;
      max-width: 90%;
      z-index: 20;
      box-shadow: 0 0 16px rgba(0, 255, 102, 0.15);
    }

    #center-overlay.hidden {
      display: none;
    }

    .box-title {
      color: var(--phosphor-bright);
      font-size: 22px;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .box-body {
      color: var(--phosphor);
      font-size: 19px;
      line-height: 1.4;
      white-space: pre-line;
    }

    .box-danger {
      color: #ff3333;
      text-shadow: 0 0 6px rgba(255, 51, 51, 0.6);
    }

    /* Main Terminal Log */
    #terminal {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      word-break: break-word;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #terminal::-webkit-scrollbar {
      width: 6px;
    }
    #terminal::-webkit-scrollbar-thumb {
      background: var(--phosphor-dim);
    }

    /* Messages & Rows */
    .msg-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .msg-header {
      display: flex;
      gap: 8px;
    }
    .msg-text {
      white-space: pre-wrap;
    }
    .ts {
      color: var(--phosphor-dim);
      white-space: nowrap;
    }
    .user-self {
      color: var(--phosphor-bright);
      font-weight: bold;
      white-space: nowrap;
    }
    .user-peer {
      color: #70db93;
      white-space: nowrap;
    }
    .sys-msg {
      color: var(--phosphor-dim);
      font-style: italic;
      white-space: pre-wrap;
    }
    .sys-err {
      color: #ff3333;
      text-shadow: 0 0 6px rgba(255, 51, 51, 0.5);
    }

    /* High-Density ASCII Display */
    .ascii-display-wrapper {
      margin-top: 4px;
      padding: 6px;
      background: #001105;
      border: 1px dashed var(--phosphor-dim);
      display: inline-block;
      max-width: fit-content;
    }
    .ascii-display {
      font-family: 'Courier New', Courier, monospace;
      font-size: 5.5px;
      line-height: 5.5px;
      letter-spacing: 0px;
      color: var(--phosphor);
      white-space: pre;
      margin: 0;
      user-select: none;
      text-shadow: none;
    }

    /* Bottom Command Prompt */
    #prompt-bar {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      background: var(--bar-bg);
      border-top: 1px solid var(--phosphor-dim);
      z-index: 10;
    }

    #prompt-label {
      margin-right: 8px;
      white-space: nowrap;
    }

    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--phosphor-bright);
      font-family: 'VT323', monospace;
      font-size: 21px;
      caret-color: var(--phosphor);
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.6);
    }

    #cmd-input:disabled {
      cursor: not-allowed;
    }
  </style>

          resolve();
          return;
        }
        let idx = 0;

            resolve();
          }

      });
