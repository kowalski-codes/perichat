<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PERI CHAT ROOM ONLY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --phosphor: #00ff66;
      --phosphor-dim: #008f39;
      --phosphor-bright: #66ff99;
      --bg: #050a05;
      --scanline: rgba(0, 20, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--phosphor);
      font-family: 'VT323', monospace;
      font-size: 21px;
      line-height: 1.35;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.45);
    }

    /* CRT Overlay & Scanline Effects */
    .crt-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 3px 100%;
      z-index: 100;
    }

    .crt-vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      z-index: 99;
    }

    /* Top Status Bar */
    header {
      background: #001a09;
      border-bottom: 1px solid var(--phosphor-dim);
      padding: 6px 14px;
      display: flex;
      justify-content: space-between;
      text-transform: uppercase;
      font-size: 18px;
      letter-spacing: 1px;
    }

    /* Main Terminal Log */
    #terminal {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      word-break: break-word;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #terminal::-webkit-scrollbar {
      width: 6px;
    }
    #terminal::-webkit-scrollbar-thumb {
      background: var(--phosphor-dim);
    }

    /* Messages & Logs */
    .msg-row {
      display: flex;
      gap: 8px;
    }
    .ts {
      color: var(--phosphor-dim);
    }
    .user-self {
      color: var(--phosphor-bright);
      font-weight: bold;
    }
    .user-peer {
      color: #70db93;
    }
    .sys-msg {
      color: var(--phosphor-dim);
      font-style: italic;
    }
    .sys-err {
      color: #ff3333;
      text-shadow: 0 0 6px rgba(255, 51, 51, 0.5);
    }

    /* Bottom Command Prompt */
    #prompt-bar {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      background: #001105;
      border-top: 1px solid var(--phosphor-dim);
    }

    #prompt-label {
      margin-right: 8px;
      white-space: nowrap;
    }

    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--phosphor-bright);
      font-family: 'VT323', monospace;
      font-size: 21px;
      caret-color: var(--phosphor);
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.6);
    }
  </style>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="crt-overlay"></div>
  <div class="crt-vignette"></div>

  <header>
    <span>[SECURE NODE // RELAY-02]</span>
    <span id="header-user">SESSION: LOCKED</span>
    <span id="clock">--:--:--</span>
  </header>

  <main id="terminal"></main>

  <footer id="prompt-bar">
    <span id="prompt-label">PASSWORD:</span>
    <input type="password" id="cmd-input" autocomplete="off" autofocus />
  </footer>

  <script>
    // ==========================================
    // 1. CONFIGURATION (PASTE YOUR DETAILS HERE)
    // ==========================================
    const SECRET_PASSWORD = "@kcguevS08w"; // Set your secret access password

  const firebaseConfig = {
    apiKey: "AIzaSyA_hKOx4wb17A3PItA32pHLuXgofG2P9Ig",
    authDomain: "retro-terminal-aa057.firebaseapp.com",
    projectId: "retro-terminal-aa057",
    storageBucket: "retro-terminal-aa057.firebasestorage.app",
    messagingSenderId: "905629346840",
    appId: "1:905629346840:web:b1708470592011e9d8a76d"
    };

    // ==========================================
    // 2. STATE & ELEMENT BINDINGS
    // ==========================================
    let currentStep = "PASSWORD"; // Stages: PASSWORD -> USERNAME -> CHAT
    let currentUser = "";
    let db = null;
    let messagesRef = null;

    const terminal = document.getElementById("terminal");
    const input = document.getElementById("cmd-input");
    const promptLabel = document.getElementById("prompt-label");
    const headerUser = document.getElementById("header-user");

    // Real-time Header Clock
    function updateClock() {
      const now = new Date();
      document.getElementById("clock").textContent = now.toTimeString().split(" ")[0];
    }
    setInterval(updateClock, 1000);
    updateClock();

    function writeLine(text, className = "") {
      const div = document.createElement("div");
      if (className) div.className = className;
      div.innerHTML = text;
      terminal.appendChild(div);
      terminal.scrollTop = terminal.scrollHeight;
    }

    // Boot Banner
    function printBootSequence() {
      writeLine("=================================================");
      writeLine("  CLASSIFIED PRIVATE COMMUNICATION CHANNEL v1.0  ");
      writeLine("  RESTRICTED ACCESS // NODE-02 ENCRYPTED RELAY   ");
      writeLine("=================================================");
      writeLine("INITIALIZING AUTHENTICATION PROTOCOL...");
      writeLine("PLEASE ENTER ACCESS AUTHORIZATION KEY.");
    }
    printBootSequence();

    // ==========================================
    // 3. INPUT HANDLER & COMMAND PARSER
    // ==========================================
    input.addEventListener("keydown", async (e) => {
      if (e.key !== "Enter") return;
      const val = input.value.trim();
      input.value = "";
      if (!val) return;

      // STAGE 1: PASSWORD AUTHENTICATION
      if (currentStep === "PASSWORD") {
        if (val === SECRET_PASSWORD) {
          writeLine("[OK] AUTHORIZATION ACCEPTED. IDENTITY CONFIRMED.", "sys-msg");
          writeLine("ENTER OPERATOR CALLSIGN / HANDLE:");
          promptLabel.textContent = "CALLSIGN:";
          input.type = "text";
          currentStep = "USERNAME";
        } else {
          writeLine("[DENIED] INVALID PASSCODE. ACCESS REJECTED.", "sys-err");
        }
        return;
      }

      // STAGE 2: HANDLE / IDENTITY
      if (currentStep === "USERNAME") {
        currentUser = val.toUpperCase();
        headerUser.textContent = `CALLSIGN: ${currentUser}`;
        writeLine(`[OK] CALLSIGN REGISTERED: ${currentUser}`, "sys-msg");
        writeLine("DECRYPTING ARCHIVES & CONNECTING TO LIVE CHANNEL...", "sys-msg");
        writeLine("AVAILABLE COMMANDS: /clear, /purge, /help, /whoami", "sys-msg");
        writeLine("-------------------------------------------------");
        
        promptLabel.textContent = `${currentUser}>`;
        currentStep = "CHAT";
        initFirebase();
        return;
      }

      // STAGE 3: LIVE TRANSMISSION & COMMANDS
      if (currentStep === "CHAT") {
        // Command: /clear (Wipes current screen buffer only)
        if (val === "/clear") {
          terminal.innerHTML = "";
          writeLine("TERMINAL BUFFER CLEARED. ARCHIVES REMAIN IN DATABASE.", "sys-msg");
          return;
        }

        // Command: /purge (Wipes persistent cloud database)
        if (val === "/purge") {
          if (confirm("WARNING: Purge will permanently delete all shared logs. Continue?")) {
            if (messagesRef) {
              await messagesRef.remove();
              terminal.innerHTML = "";
              writeLine("ALL ARCHIVED LOGS HAVE BEEN PERMANENTLY PURGED.", "sys-err");
            }
          }
          return;
        }

        // Command: /whoami
        if (val === "/whoami") {
          writeLine(`CURRENT OPERATOR: ${currentUser}`, "sys-msg");
          return;
        }

        // Command: /help
        if (val === "/help") {
          writeLine("COMMAND DIRECTIVES:", "sys-msg");
          writeLine("  /clear   : Wipes local terminal screen");
          writeLine("  /purge   : Permanently deletes all saved messages from the cloud");
          writeLine("  /whoami  : Displays current active callsign");
          return;
        }

        // Send Message to Firebase Realtime Database
        if (messagesRef) {
          const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          messagesRef.push({
            user: currentUser,
            text: val,
            time: timestamp
          });
        }
      }
    });

    // ==========================================
    // 4. FIREBASE REALTIME CONNECTION
    // ==========================================
    function initFirebase() {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();
        messagesRef = db.ref("chat_logs");

        // Listen for new messages & load initial message history
        messagesRef.on("child_added", (snapshot) => {
          const data = snapshot.val();
          if (!data) return;

          const isSelf = data.user === currentUser;
          const userClass = isSelf ? "user-self" : "user-peer";
          
          writeLine(`
            <div class="msg-row">
              <span class="ts">[${data.time}]</span>
              <span class="${userClass}">&lt;${data.user}&gt;</span>
              <span>${escapeHtml(data.text)}</span>
            </div>
          `);
        });

      } catch (err) {
        writeLine(`[RELAY ERROR]: UNABLE TO CONNECT TO REALTIME CLOUD. VERIFY FIREBASE KEYS.`, "sys-err");
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Keep focus inside terminal input on click
    document.addEventListener("click", () => {
      input.focus();
    });
  </script>
</body>
</html>
