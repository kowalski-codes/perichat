name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets & Install Dependencies
        run: |
          cd docs
          # Create the webDir folder Capacitor expects
          mkdir -p www
          # Copy website files into www, excluding android and node_modules
          cp index.html manifest.json *.png *.mp3 www/ 2>/dev/null || true
          npm install --save @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android Platform Non-Interactively
        run: |
          cd docs
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          cd docs/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: perichat-debug-apk
          path: docs/android/app/build/outputs/apk/debug/app-debug.apk
