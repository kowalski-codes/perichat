<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PERI CHAT ROOM ONLY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --phosphor: #7e9481;
      --phosphor-dim: #5a6e5d;
      --phosphor-bright: #96ab99;
      --bg: #232826;
      --bar-bg: #1e2321;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--phosphor);
      font-family: 'VT323', monospace;
      font-size: 21px;
      line-height: 1.35;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    header {
      background: var(--bar-bg);
      border-bottom: 1px solid var(--phosphor-dim);
      padding: 6px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-transform: uppercase;
      font-size: 16px;
      letter-spacing: 1px;
      z-index: 10;
    }

    #clock {
      font-size: 13px;
      color: var(--phosphor-dim);
      letter-spacing: 0.5px;
    }

    #center-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid var(--phosphor-dim);
      padding: 24px 32px;
      background: var(--bg);
      text-align: center;
      min-width: 380px;
      max-width: 90%;
      z-index: 20;
      pointer-events: none;
    }

    #center-overlay.hidden {
      display: none;
    }

    .box-title {
      color: var(--phosphor-bright);
      font-size: 22px;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .box-body {
      color: var(--phosphor);
      font-size: 19px;
      line-height: 1.4;
      white-space: pre-line;
    }

    .box-danger {
      color: #9c6060;
    }

    #terminal {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      word-break: break-word;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #terminal::-webkit-scrollbar {
      width: 6px;
    }
    #terminal::-webkit-scrollbar-thumb {
      background: var(--phosphor-dim);
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .msg-header {
      display: flex;
      gap: 8px;
    }
    .msg-text {
      white-space: pre-wrap;
    }
    .ts {
      color: var(--phosphor-dim);
      white-space: nowrap;
    }
    .user-self {
      color: var(--phosphor-bright);
      font-weight: bold;
      white-space: nowrap;
    }
    .user-peer {
      color: var(--phosphor);
      white-space: nowrap;
    }
    .sys-msg {
      color: var(--phosphor-dim);
      font-style: italic;
      white-space: pre-wrap;
    }
    .sys-err {
      color: #9c6060;
    }

    .ascii-display-wrapper {
      margin-top: 4px;
      padding: 6px;
      background: #181d1b;
      border: 1px dashed var(--phosphor-dim);
      display: inline-block;
      max-width: fit-content;
    }
    .ascii-display {
      font-family: 'Courier New', Courier, monospace;
      font-size: 5.5px;
      line-height: 5.5px;
      letter-spacing: 0px;
      color: var(--phosphor);
      white-space: pre;
      margin: 0;
      user-select: none;
    }

    #prompt-bar {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      background: var(--bar-bg);
      border-top: 1px solid var(--phosphor-dim);
      z-index: 30;
    }

    #prompt-label {
      margin-right: 8px;
      white-space: nowrap;
    }

    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--phosphor-bright);
      font-family: 'VT323', monospace;
      font-size: 21px;
      caret-color: var(--phosphor);
    }

    #cmd-input:disabled {
      cursor: not-allowed;
    }
  </style>

  <!-- omggif: GIF binary decoder -->
  <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <header>
    <span id="clock">--:--:--</span>
    <span id="header-user">SESSION: LOCKED</span>
  </header>

  <div id="center-overlay">
    <div id="box-title" class="box-title">[ ENCRYPTED RELAY NODE ]</div>
    <div id="box-body" class="box-body">WARNING: RESTRICTED CIPHERTEXT PROTOCOL.
UNAUTHORIZED HANDSHAKES LOGGED.
AUTHENTICATION ATTEMPTS REMAINING: 3</div>
  </div>

  <main id="terminal"></main>

  <footer id="prompt-bar">
    <span id="prompt-label">PASSWORD:</span>
    <input type="password" id="cmd-input" autocomplete="off" autofocus />
  </footer>

  <script>
    const SECRET_PASSWORD = "@kcguevS08w";
    let attemptsRemaining = 3;

    // perichat Firebase Credentials
    const firebaseConfig = {
      apiKey: "AIzaSyA_hKOx4wb17A3PItA32pHLuXgofG2P9Ig",
      authDomain: "retro-terminal-aa057.firebaseapp.com",
      projectId: "retro-terminal-aa057",
      storageBucket: "retro-terminal-aa057.firebasestorage.app",
      messagingSenderId: "905629346840",
      appId: "1:905629346840:web:b1708470592011e9d8a76d"
    };

    let currentStep = "PASSWORD"; 
    let currentUser = "";
    let isInitialLoadDone = false;
    let isBooting = false;
    let db = null;
    let messagesRef = null;

    const soundJoin = new Audio("join.mp3");
    const soundMsg = new Audio("msg.mp3");

    const terminal = document.getElementById("terminal");
    const input = document.getElementById("cmd-input");
    const promptLabel = document.getElementById("prompt-label");
    const headerUser = document.getElementById("header-user");
    const centerOverlay = document.getElementById("center-overlay");
    const boxTitle = document.getElementById("box-title");
    const boxBody = document.getElementById("box-body");

    function getMilitaryTime() {
      return new Date().toLocaleTimeString('en-GB', { 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit', 
        hour12: false 
      });
    }

    function updateClock() {
      document.getElementById("clock").textContent = getMilitaryTime();
    }
    setInterval(updateClock, 1000);
    updateClock();

    function typeTextPromise(targetElement, fullText, speed = 14) {
      return new Promise((resolve) => {
        if (!fullText) {
          resolve();
          return;
        }
        let idx = 0;
        const interval = setInterval(() => {
          if (idx < fullText.length) {
            targetElement.textContent += fullText.charAt(idx);
            idx++;
            terminal.scrollTop = terminal.scrollHeight;
          } else {
            clearInterval(interval);
            resolve();
          }
        }, speed);
      });
    }

    function writeLine(htmlContent, className = "") {
      const div = document.createElement("div");
      if (className) div.className = className;
      div.innerHTML = htmlContent;
      terminal.appendChild(div);
      terminal.scrollTop = terminal.scrollHeight;
      return div;
    }

    function streamLine(prefixHtml, textPayload, mediaUrl = null) {
      const container = document.createElement("div");
      container.className = "msg-row";

      const headerDiv = document.createElement("div");
      headerDiv.className = "msg-header";
      headerDiv.innerHTML = prefixHtml;

      const textSpan = document.createElement("span");
      textSpan.className = "msg-text";
      headerDiv.appendChild(textSpan);
      container.appendChild(headerDiv);

      terminal.appendChild(container);

      if (textPayload && textPayload.trim().length > 0) {
        typeTextPromise(textSpan, textPayload, 14).then(() => {
          if (mediaUrl) mountAsciiPlayer(container, mediaUrl);
        });
      } else {
        if (mediaUrl) mountAsciiPlayer(container, mediaUrl);
      }
    }

    async function startBootSequence() {
      isBooting = true;
      input.disabled = true;

      const line1 = document.createElement("div");
      line1.className = "sys-msg";
      terminal.appendChild(line1);
      await typeTextPromise(line1, `[OK] CALLSIGN REGISTERED: ${currentUser}`);

      const line2 = document.createElement("div");
      line2.className = "sys-msg";
      terminal.appendChild(line2);
      const baseText = "DECRYPTING ARCHIVES & CONNECTING TO LIVE CHANNEL";
      line2.textContent = baseText;

      let elapsed = 0;
      let dotCount = 0;
      await new Promise((resolve) => {
        const loadInterval = setInterval(() => {
          elapsed += 250;
          dotCount = (dotCount + 1) % 5;
          line2.textContent = baseText + ".".repeat(dotCount);
          if (elapsed >= 3000) {
            clearInterval(loadInterval);
            line2.textContent = baseText + "... [DONE]";
            resolve();
          }
        }, 250);
      });

      const line3 = document.createElement("div");
      line3.className = "sys-msg";
      terminal.appendChild(line3);
      await typeTextPromise(line3, "TYPE /help FOR AVAILABLE COMMAND DIRECTIVES.");

      const line4 = document.createElement("div");
      line4.className = "sys-msg";
      terminal.appendChild(line4);
      await typeTextPromise(line4, "-------------------------------------------------");

      input.disabled = false;
      input.focus();
      isBooting = false;
      initFirebase();
    }

    // --- HIGH-DENSITY ASCII ENGINE (STATIC IMAGES & ANIMATED GIFS) ---
    const DENSITY_RAMP = " .:-=+*#%@";
    const TARGET_W = 80;
    const TARGET_H = 36;

    function extractMediaUrl(str) {
      const urlRegex = /(https?:\/\/[^\s]+(?:\.(?:gif|png|jpe?g|webp)(?:\?[^\s]*)?|tenor\.com\/[^\s]+|giphy\.com\/[^\s]+))/i;
      const match = str.match(urlRegex);
      return match ? match[0] : null;
    }

    function convertPixelsToAscii(ctx, w, h) {
      const sample = ctx.getImageData(0, 0, w, h).data;
      let frameStr = "";
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = (y * w + x) * 4;
          const r = sample[idx];
          const g = sample[idx + 1];
          const b = sample[idx + 2];
          const a = sample[idx + 3];

          if (a < 64) {
            frameStr += " ";
          } else {
            const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            const charIdx = Math.floor(lum * (DENSITY_RAMP.length - 1));
            frameStr += DENSITY_RAMP[charIdx];
          }
        }
        frameStr += "\n";
      }
      return frameStr;
    }

    async function fetchRawBytes(rawUrl) {
      if (rawUrl.startsWith("data:")) {
        const base64Data = rawUrl.split(",")[1];
        const binaryStr = atob(base64Data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }
        return bytes;
      }

      const proxyList = [
        `https://images.weserv.nl/?url=${encodeURIComponent(rawUrl)}&default=${encodeURIComponent(rawUrl)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(rawUrl)}`,
        `https://corsproxy.io/?url=${encodeURIComponent(rawUrl)}`
      ];

      for (const target of proxyList) {
        try {
          const resp = await fetch(target);
          if (resp.ok) {
            const buf = await resp.arrayBuffer();
            return new Uint8Array(buf);
          }
        } catch (_) {}
      }
      throw new Error("Unable to load remote media binary.");
    }

    function renderStaticImageToAscii(source) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = TARGET_W;
          canvas.height = TARGET_H;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, TARGET_W, TARGET_H);
          resolve(convertPixelsToAscii(ctx, TARGET_W, TARGET_H));
        };
        img.onerror = reject;
        img.src = typeof source === "string" ? source : URL.createObjectURL(source);
      });
    }

    async function mountAsciiPlayer(containerDiv, rawUrl) {
      const wrapper = document.createElement("div");
      wrapper.className = "ascii-display-wrapper";

      const pre = document.createElement("pre");
      pre.className = "ascii-display";
      pre.textContent = "[SYNCHRONIZING VISUAL STREAM...]";
      wrapper.appendChild(pre);
      containerDiv.appendChild(wrapper);
      terminal.scrollTop = terminal.scrollHeight;

      try {
        const byteArray = await fetchRawBytes(rawUrl);
        const isGif = byteArray[0] === 0x47 && byteArray[1] === 0x49 && byteArray[2] === 0x46;

        if (isGif) {
          const gr = new GifReader(byteArray);
          const frameCount = gr.numFrames();
          if (frameCount === 0) throw new Error("Zero frames detected");

          const offCanvas = document.createElement("canvas");
          offCanvas.width = gr.width;
          offCanvas.height = gr.height;
          const ctx = offCanvas.getContext("2d");
          const imgData = ctx.createImageData(gr.width, gr.height);

          const downCanvas = document.createElement("canvas");
          downCanvas.width = TARGET_W;
          downCanvas.height = TARGET_H;
          const downCtx = downCanvas.getContext("2d");

          const asciiFrames = [];
          const frameDelays = [];

          for (let i = 0; i < frameCount; i++) {
            const info = gr.frameInfo(i);
            gr.decodeAndBlitFrameRGBA(i, imgData.data);
            ctx.putImageData(imgData, 0, 0);

            downCtx.drawImage(offCanvas, 0, 0, TARGET_W, TARGET_H);
            asciiFrames.push(convertPixelsToAscii(downCtx, TARGET_W, TARGET_H));

            const delay = info.delay ? info.delay * 10 : 100;
            frameDelays.push(delay < 20 ? 80 : delay);
          }

          let cur = 0;
          function renderLoop() {
            pre.textContent = asciiFrames[cur];
            const curDelay = frameDelays[cur];
            cur = (cur + 1) % asciiFrames.length;
            setTimeout(renderLoop, curDelay);
          }
          renderLoop();
        } else {
          const blob = new Blob([byteArray]);
          const asciiFrame = await renderStaticImageToAscii(blob);
          pre.textContent = asciiFrame;
        }
      } catch (err) {
        pre.textContent = "[STREAM RESTRICTED: CORS BLOCKED]\nTIP: Copy the image directly and press Ctrl+V.";
      }
      terminal.scrollTop = terminal.scrollHeight;
    }

    // Direct Image Paste (Single listener with stopPropagation)
    let isPasting = false;
    window.addEventListener("paste", (e) => {
      if (currentStep !== "CHAT" || isPasting) return;
      const items = (e.clipboardData || window.clipboardData)?.items;
      if (!items) return;

      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf("image") !== -1) {
          const file = items[i].getAsFile();
          if (file) {
            e.preventDefault();
            e.stopPropagation();
            isPasting = true;

            const reader = new FileReader();
            reader.onload = (evt) => {
              if (messagesRef) {
                messagesRef.push({
                  user: currentUser,
                  text: "",
                  gifUrl: evt.target.result,
                  time: getMilitaryTime()
                });
              }
              setTimeout(() => { isPasting = false; }, 300);
            };
            reader.readAsDataURL(file);
            return;
          }
        }
      }
    });

    // Drag-and-Drop Handler
    window.addEventListener("dragover", (e) => e.preventDefault());
    window.addEventListener("drop", (e) => {
      e.preventDefault();
      if (currentStep !== "CHAT") return;
      const file = e.dataTransfer.files[0];
      if (file && (file.type.indexOf("image") !== -1 || file.name.match(/\.(gif|png|jpe?g|webp)$/i))) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          if (messagesRef) {
            messagesRef.push({
              user: currentUser,
              text: "",
              gifUrl: evt.target.result,
              time: getMilitaryTime()
            });
          }
        };
        reader.readAsDataURL(file);
      }
    });

    // Input Prompt & Commands
    input.addEventListener("keydown", async (e) => {
      if (e.key !== "Enter") return;
      const val = input.value.trim();
      input.value = "";
      if (!val || isBooting) return;

      if (currentStep === "PASSWORD") {
        if (val === SECRET_PASSWORD) {
          boxTitle.textContent = "[ IDENTITY ACCEPTED ]";
          boxBody.textContent = "ENTER OPERATOR CALLSIGN / HANDLE BELOW.";
          promptLabel.textContent = "CALLSIGN:";
          input.type = "text";
          currentStep = "USERNAME";
        } else {
          attemptsRemaining--;
          if (attemptsRemaining > 0) {
            boxBody.textContent = `WARNING: RESTRICTED CIPHERTEXT PROTOCOL.\nUNAUTHORIZED HANDSHAKES LOGGED.\nAUTHENTICATION ATTEMPTS REMAINING: ${attemptsRemaining}`;
          } else {
            boxTitle.textContent = "TERMINAL HALTED";
            boxTitle.classList.add("box-danger");
            boxBody.textContent = "GOODBYE.\nCONNECTION SEVERED.";
            boxBody.classList.add("box-danger");
            promptLabel.textContent = "[HALTED]";
            input.disabled = true;
          }
        }
        return;
      }

      if (currentStep === "USERNAME") {
        currentUser = val.toUpperCase();
        headerUser.textContent = `CALLSIGN: ${currentUser}`;
        centerOverlay.classList.add("hidden");
        promptLabel.textContent = `${currentUser}>`;
        currentStep = "CHAT";

        soundJoin.play().catch(() => {});
        startBootSequence();
        return;
      }

      if (currentStep === "CHAT") {
        if (val === "/clear") {
          terminal.innerHTML = "";
          writeLine("TERMINAL BUFFER CLEARED. ARCHIVES REMAIN IN DATABASE.", "sys-msg");
          return;
        }

        if (val === "/purge") {
          if (confirm("WARNING: Purge will permanently delete all shared logs. Continue?")) {
            if (messagesRef) {
              await messagesRef.remove();
              terminal.innerHTML = "";
              writeLine("ALL ARCHIVED LOGS HAVE BEEN PERMANENTLY PURGED.", "sys-err");
            }
          }
          return;
        }

        if (val === "/whoami") {
          writeLine(`CURRENT OPERATOR: ${currentUser}`, "sys-msg");
          return;
        }

        if (val === "/help") {
          const helpManual = 
`======================= COMMAND DIRECTIVES =======================
  COMMAND    DESCRIPTION
  -------    -----------
  /help      Display terminal manual & directives
  /clear     Flush local terminal screen buffer
  /whoami    Display active operator handle
  /purge     Permanently erase all archived logs from cloud
==================================================================`;
          writeLine(helpManual, "sys-msg");
          return;
        }

        const detectedMedia = extractMediaUrl(val);
        const textPayload = detectedMedia === val ? "" : val;

        if (messagesRef) {
          messagesRef.push({
            user: currentUser,
            text: textPayload,
            gifUrl: detectedMedia || null,
            time: getMilitaryTime()
          });
        }
      }
    });

    function initFirebase() {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();
        messagesRef = db.ref("chat_logs");

        messagesRef.once("value", () => {
          isInitialLoadDone = true;
        });

        messagesRef.on("child_added", (snapshot) => {
          const data = snapshot.val();
          if (!data) return;

          const isSelf = data.user === currentUser;
          const userClass = isSelf ? "user-self" : "user-peer";
          const prefix = `<span class="ts">[${data.time}]</span> <span class="${userClass}">&lt;${data.user}&gt;</span> `;

          if (!isInitialLoadDone) {
            const container = document.createElement("div");
            container.className = "msg-row";

            const headerDiv = document.createElement("div");
            headerDiv.className = "msg-header";
            const textContent = data.text ? `<span class="msg-text">${escapeHtml(data.text)}</span>` : "";
            headerDiv.innerHTML = `${prefix}${textContent}`;
            container.appendChild(headerDiv);

            terminal.appendChild(container);
            terminal.scrollTop = terminal.scrollHeight;

            if (data.gifUrl) {
              mountAsciiPlayer(container, data.gifUrl);
            }
          } else {
            if (!isSelf) {
              soundMsg.play().catch(() => {});
            }
            streamLine(prefix, data.text || "", data.gifUrl || null);
          }
        });

      } catch (err) {
        writeLine("[RELAY ERROR]: UNABLE TO CONNECT TO REALTIME CLOUD.", "sys-err");
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.addEventListener("click", () => {
      if (!input.disabled && !isBooting) {
        input.focus();
      }
    });
  </script>
</body>
</html>
