<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PERI CHAT ROOM ONLY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --phosphor: #00ff66;
      --phosphor-dim: #008f39;
      --phosphor-bright: #66ff99;
      --bg: #050a05;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--phosphor);
      font-family: 'VT323', monospace;
      font-size: 21px;
      line-height: 1.35;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.45);
    }

    /* Top Status Bar */
    header {
      background: #001a09;
      border-bottom: 1px solid var(--phosphor-dim);
      padding: 6px 14px;
      display: flex;
      justify-content: space-between;
      text-transform: uppercase;
      font-size: 18px;
      letter-spacing: 1px;
    }

    /* Main Terminal Log */
    #terminal {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      word-break: break-word;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #terminal::-webkit-scrollbar {
      width: 6px;
    }
    #terminal::-webkit-scrollbar-thumb {
      background: var(--phosphor-dim);
    }

    /* Messages & Logs */
    .msg-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .msg-header {
      display: flex;
      gap: 8px;
    }
    .msg-text {
      white-space: pre-wrap;
    }
    .ts {
      color: var(--phosphor-dim);
      white-space: nowrap;
    }
    .user-self {
      color: var(--phosphor-bright);
      font-weight: bold;
      white-space: nowrap;
    }
    .user-peer {
      color: #70db93;
      white-space: nowrap;
    }
    .sys-msg {
      color: var(--phosphor-dim);
      font-style: italic;
    }
    .sys-err {
      color: #ff3333;
      text-shadow: 0 0 6px rgba(255, 51, 51, 0.5);
    }

    /* High-Density ASCII Display */
    .ascii-display-wrapper {
      margin-top: 4px;
      padding: 6px;
      background: #001105;
      border: 1px dashed var(--phosphor-dim);
      display: inline-block;
      max-width: fit-content;
    }
    .ascii-display {
      font-family: 'Courier New', Courier, monospace;
      font-size: 5.5px;
      line-height: 5.5px;
      letter-spacing: 0px;
      color: var(--phosphor);
      white-space: pre;
      margin: 0;
      user-select: none;
      text-shadow: none;
    }

    /* Bottom Command Prompt */
    #prompt-bar {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      background: #001105;
      border-top: 1px solid var(--phosphor-dim);
    }

    #prompt-label {
      margin-right: 8px;
      white-space: nowrap;
    }

    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--phosphor-bright);
      font-family: 'VT323', monospace;
      font-size: 21px;
      caret-color: var(--phosphor);
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.6);
    }
  </style>

  <!-- omggif: GIF binary decoder -->
  <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <header>
    <span id="clock">--:--:--</span>
    <span id="header-user">SESSION: LOCKED</span>
  </header>

  <main id="terminal"></main>

  <footer id="prompt-bar">
    <span id="prompt-label">PASSWORD:</span>
    <input type="password" id="cmd-input" autocomplete="off" autofocus />
  </footer>

  <script>
    const SECRET_PASSWORD = "@kcguevS08w";

    const HEART_ART = 
`⠀⠀⠀⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⠀⠀⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿
⠀⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿
⠀⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿
⠀⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿
⠀⠀⠀⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿

⠀⠀⠀⠀⠀⠀⠀⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿
⠀⠀⠀⠀⠀⠀⠀⠀⠀⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣿⣿`;

    const firebaseConfig = {
      apiKey: "AIzaSyA_hKOx4wb17A3PItA32pHLuXgofG2P9Ig",
      authDomain: "retro-terminal-aa057.firebaseapp.com",
      projectId: "retro-terminal-aa057",
      storageBucket: "retro-terminal-aa057.firebasestorage.app",
      messagingSenderId: "905629346840",
      appId: "1:905629346840:web:b1708470592011e9d8a76d"
    };

    let currentStep = "PASSWORD"; 
    let currentUser = "";
    let db = null;
    let messagesRef = null;

    const terminal = document.getElementById("terminal");
    const input = document.getElementById("cmd-input");
    const promptLabel = document.getElementById("prompt-label");
    const headerUser = document.getElementById("header-user");

    function getMilitaryTime() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    }

    function updateClock() {
      document.getElementById("clock").textContent = getMilitaryTime();
    }
    setInterval(updateClock, 1000);
    updateClock();

    function writeLine(text, className = "") {
      const div = document.createElement("div");
      if (className) div.className = className;
      div.innerHTML = text;
      terminal.appendChild(div);
      terminal.scrollTop = terminal.scrollHeight;
      return div;
    }

    // --- HIGH-DENSITY ASCII ENGINE (STATIC IMAGES & ANIMATED GIFS) ---
    const DENSITY_RAMP = " .:-=+*#%@";
    const TARGET_W = 80;
    const TARGET_H = 36;

    function extractMediaUrl(str) {
      const urlRegex = /(https?:\/\/[^\s]+(?:\.(?:gif|png|jpe?g|webp)(?:\?[^\s]*)?|tenor\.com\/[^\s]+|giphy\.com\/[^\s]+))/i;
      const match = str.match(urlRegex);
      return match ? match[0] : null;
    }

    function convertPixelsToAscii(ctx, w, h) {
      const sample = ctx.getImageData(0, 0, w, h).data;
      let frameStr = "";
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = (y * w + x) * 4;
          const r = sample[idx];
          const g = sample[idx + 1];
          const b = sample[idx + 2];
          const a = sample[idx + 3];

          if (a < 64) {
            frameStr += " ";
          } else {
            const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            const charIdx = Math.floor(lum * (DENSITY_RAMP.length - 1));
            frameStr += DENSITY_RAMP[charIdx];
          }
        }
        frameStr += "\n";
      }
      return frameStr;
    }

    async function fetchRawBytes(rawUrl) {
      if (rawUrl.startsWith("data:")) {
        const base64Data = rawUrl.split(",")[1];
        const binaryStr = atob(base64Data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }
        return bytes;
      }

      const proxyList = [
        `https://images.weserv.nl/?url=${encodeURIComponent(rawUrl)}&default=${encodeURIComponent(rawUrl)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(rawUrl)}`,
        `https://corsproxy.io/?url=${encodeURIComponent(rawUrl)}`
      ];

      for (const target of proxyList) {
        try {
          const resp = await fetch(target);
          if (resp.ok) {
            const buf = await resp.arrayBuffer();
            return new Uint8Array(buf);
          }
        } catch (_) {}
      }
      throw new Error("Unable to load remote media binary.");
    }

    function renderStaticImageToAscii(source) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = TARGET_W;
          canvas.height = TARGET_H;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, TARGET_W, TARGET_H);
          resolve(convertPixelsToAscii(ctx, TARGET_W, TARGET_H));
        };
        img.onerror = reject;
        img.src = typeof source === "string" ? source : URL.createObjectURL(source);
      });
    }

    async function mountAsciiPlayer(containerDiv, rawUrl) {
      const wrapper = document.createElement("div");
      wrapper.className = "ascii-display-wrapper";

      const pre = document.createElement("pre");
      pre.className = "ascii-display";
      pre.textContent = "[SYNCHRONIZING VISUAL STREAM...]";
      wrapper.appendChild(pre);
      containerDiv.appendChild(wrapper);
      terminal.scrollTop = terminal.scrollHeight;

      try {
        const byteArray = await fetchRawBytes(rawUrl);
        const isGif = byteArray[0] === 0x47 && byteArray[1] === 0x49 && byteArray[2] === 0x46;

        if (isGif) {
          const gr = new GifReader(byteArray);
          const frameCount = gr.numFrames();
          if (frameCount === 0) throw new Error("Zero frames detected");

          const offCanvas = document.createElement("canvas");
          offCanvas.width = gr.width;
          offCanvas.height = gr.height;
          const ctx = offCanvas.getContext("2d");
          const imgData = ctx.createImageData(gr.width, gr.height);

          const downCanvas = document.createElement("canvas");
          downCanvas.width = TARGET_W;
          downCanvas.height = TARGET_H;
          const downCtx = downCanvas.getContext("2d");

          const asciiFrames = [];
          const frameDelays = [];

          for (let i = 0; i < frameCount; i++) {
            const info = gr.frameInfo(i);
            gr.decodeAndBlitFrameRGBA(i, imgData.data);
            ctx.putImageData(imgData, 0, 0);

            downCtx.drawImage(offCanvas, 0, 0, TARGET_W, TARGET_H);
            asciiFrames.push(convertPixelsToAscii(downCtx, TARGET_W, TARGET_H));

            const delay = info.delay ? info.delay * 10 : 100;
            frameDelays.push(delay < 20 ? 80 : delay);
          }

          let cur = 0;
          function renderLoop() {
            pre.textContent = asciiFrames[cur];
            const curDelay = frameDelays[cur];
            cur = (cur + 1) % asciiFrames.length;
            setTimeout(renderLoop, curDelay);
          }
          renderLoop();
        } else {
          const blob = new Blob([byteArray]);
          const asciiFrame = await renderStaticImageToAscii(blob);
          pre.textContent = asciiFrame;
        }
      } catch (err) {
        pre.textContent = "[STREAM RESTRICTED: CORS BLOCKED]\nTIP: Copy the image directly and press Ctrl+V.";
      }
      terminal.scrollTop = terminal.scrollHeight;
    }

    // Direct Image Paste (Guards against duplicate sending)
    let isPasting = false;
    window.addEventListener("paste", (e) => {
      if (currentStep !== "CHAT" || isPasting) return;
      const items = (e.clipboardData || window.clipboardData)?.items;
      if (!items) return;

      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf("image") !== -1) {
          const file = items[i].getAsFile();
          if (file) {
            e.preventDefault();
            e.stopPropagation();
            isPasting = true;

            const reader = new FileReader();
            reader.onload = (evt) => {
              if (messagesRef) {
                messagesRef.push({
                  user: currentUser,
                  text: "",
                  gifUrl: evt.target.result,
                  time: getMilitaryTime()
                });
              }
              setTimeout(() => { isPasting = false; }, 300);
            };
            reader.readAsDataURL(file);
            return;
          }
        }
      }
    });

    // Drag-and-Drop Handler
    window.addEventListener("dragover", (e) => e.preventDefault());
    window.addEventListener("drop", (e) => {
      e.preventDefault();
      if (currentStep !== "CHAT") return;
      const file = e.dataTransfer.files[0];
      if (file && (file.type.indexOf("image") !== -1 || file.name.match(/\.(gif|png|jpe?g|webp)$/i))) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          if (messagesRef) {
            messagesRef.push({
              user: currentUser,
              text: "",
              gifUrl: evt.target.result,
              time: getMilitaryTime()
            });
          }
        };
        reader.readAsDataURL(file);
      }
    });

    // Input Handler & Command Parser
    input.addEventListener("keydown", async (e) => {
      if (e.key !== "Enter") return;
      const val = input.value.trim();
      input.value = "";
      if (!val) return;

      // STAGE 1: PASSWORD AUTHENTICATION
      if (currentStep === "PASSWORD") {
        if (val === SECRET_PASSWORD) {
          writeLine("[OK] AUTHORIZATION ACCEPTED. IDENTITY CONFIRMED.", "sys-msg");
          writeLine("ENTER OPERATOR CALLSIGN / HANDLE:");
          promptLabel.textContent = "CALLSIGN:";
          input.type = "text";
          currentStep = "USERNAME";
        } else {
          writeLine("[DENIED] INVALID PASSCODE. ACCESS REJECTED.", "sys-err");
        }
        return;
      }

      // STAGE 2: HANDLE / IDENTITY
      if (currentStep === "USERNAME") {
        currentUser = val.toUpperCase();
        headerUser.textContent = `CALLSIGN: ${currentUser}`;
        writeLine(`[OK] CALLSIGN REGISTERED: ${currentUser}`, "sys-msg");
        writeLine("DECRYPTING ARCHIVES & CONNECTING TO LIVE CHANNEL...", "sys-msg");
        writeLine("AVAILABLE COMMANDS: /clear, /purge, /help, /whoami, /mwa", "sys-msg");
        writeLine("-------------------------------------------------");
        
        promptLabel.textContent = `${currentUser}>`;
        currentStep = "CHAT";
        initFirebase();
        return;
      }

      // STAGE 3: LIVE TRANSMISSION & COMMANDS
      if (currentStep === "CHAT") {
        if (val === "/clear") {
          terminal.innerHTML = "";
          writeLine("TERMINAL BUFFER CLEARED. ARCHIVES REMAIN IN DATABASE.", "sys-msg");
          return;
        }

        if (val === "/purge") {
          if (confirm("WARNING: Purge will permanently delete all shared logs. Continue?")) {
            if (messagesRef) {
              await messagesRef.remove();
              terminal.innerHTML = "";
              writeLine("ALL ARCHIVED LOGS HAVE BEEN PERMANENTLY PURGED.", "sys-err");
            }
          }
          return;
        }

        if (val === "/whoami") {
          writeLine(`CURRENT OPERATOR: ${currentUser}`, "sys-msg");
          return;
        }

        if (val === "/help") {
          writeLine("COMMAND DIRECTIVES:", "sys-msg");
          writeLine("  /clear   : Wipes local terminal screen");
          writeLine("  /purge   : Permanently deletes all saved messages from the cloud");
          writeLine("  /whoami  : Displays current active callsign");
          writeLine("  /mwa     : Transmits love directive");
          return;
        }

        if (val === "/mwa") {
          if (messagesRef) {
            messagesRef.push({
              user: currentUser,
              text: HEART_ART,
              gifUrl: null,
              time: getMilitaryTime()
            });
          }
          return;
        }

        // Automatic URL media detection
        const detectedMedia = extractMediaUrl(val);
        const textPayload = detectedMedia === val ? "" : val;

        if (messagesRef) {
          messagesRef.push({
            user: currentUser,
            text: textPayload,
            gifUrl: detectedMedia || null,
            time: getMilitaryTime()
          });
        }
      }
    });

    // Firebase Realtime Connection
    function initFirebase() {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();
        messagesRef = db.ref("chat_logs");

        messagesRef.on("child_added", (snapshot) => {
          const data = snapshot.val();
          if (!data) return;

          const isSelf = data.user === currentUser;
          const userClass = isSelf ? "user-self" : "user-peer";
          
          const container = document.createElement("div");
          container.className = "msg-row";

          const headerDiv = document.createElement("div");
          headerDiv.className = "msg-header";
          const textContent = data.text ? `<span class="msg-text">${escapeHtml(data.text)}</span>` : "";
          headerDiv.innerHTML = `<span class="ts">[${data.time}]</span> <span class="${userClass}">&lt;${data.user}&gt;</span> ${textContent}`;
          container.appendChild(headerDiv);

          terminal.appendChild(container);
          terminal.scrollTop = terminal.scrollHeight;

          if (data.gifUrl) {
            mountAsciiPlayer(container, data.gifUrl);
          }
        });

      } catch (err) {
        writeLine(`[RELAY ERROR]: UNABLE TO CONNECT TO REALTIME CLOUD. VERIFY FIREBASE KEYS.`, "sys-err");
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.addEventListener("click", () => {
      input.focus();
    });
  </script>
